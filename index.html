<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日々の実践チェックリスト</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3a5a7c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header id="mainHeader">
    <h1>日々の実践チェックリスト</h1>
    <div class="month-nav">
      <button id="prevMonth" aria-label="前月">&lt;</button>
      <span id="currentMonth"></span>
      <button id="nextMonth" aria-label="翌月">&gt;</button>
    </div>
    <div class="header-actions">
      <span id="monthlyRate" class="monthly-rate"></span>
      <div class="btn-group">
        <span class="btn-group-label">今月</span>
        <label class="btn-action btn-import" for="importFile">読込</label>
        <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none">
        <button id="exportBtn" class="btn-action btn-export">出力</button>
      </div>
      <div class="btn-group btn-group-all">
        <span class="btn-group-label">全データ</span>
        <label class="btn-action btn-import" for="importAllFile">復元</label>
        <input type="file" id="importAllFile" accept=".xlsx,.xls" style="display:none">
        <button id="exportAllBtn" class="btn-action btn-export-all">バックアップ</button>
      </div>
    </div>
  </header>

  <!-- 月目標バー（常時表示） -->
  <div id="goalBar" class="goal-bar">
    <label class="goal-label">今月の目標</label>
    <div id="goalDisplay" class="goal-display" title="クリックで編集">未設定</div>
  </div>

  <!-- PC版：グリッド表示 -->
  <section id="pcView" class="pc-view">
    <div class="item-toolbar">
      <button id="addItemBtn" class="btn-small btn-add">＋ 項目追加</button>
    </div>
    <div class="grid-wrapper">
      <table id="checkGrid">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>
    <!-- 今日のTODO ＆ 今月のメモ・反省（2カラム） -->
    <div class="bottom-section">
      <div class="today-todo-section">
        <div class="section-header">
          <h2>今日のＴＯＤＯ</h2>
          <button id="copyTodoBtn" class="btn-copy-todo" title="メモ帳にコピー">📋 メモ帳にコピー</button>
        </div>
        <textarea id="todayTodo" maxlength="1000" placeholder="今日のＴＯＤＯを入力（1000字以内、手動で更新）"></textarea>
        <div class="char-count"><span id="todoCharCount">0</span>/1000</div>
      </div>
      <div class="month-review-section">
        <h2>今月のメモ・反省</h2>
        <textarea id="monthReview" maxlength="1000" placeholder="今月のメモ・反省を入力（1000字以内）"></textarea>
        <div class="char-count"><span id="reviewCharCount">0</span>/1000</div>
      </div>
    </div>
    <div class="reflection-section">
      <h2>振り返り</h2>
      <div id="reflectionGrid" class="reflection-grid"></div>
    </div>
  </section>

  <!-- スマホ版：1日表示 -->
  <section id="mobileView" class="mobile-view">
    <div class="day-nav">
      <button id="prevDay" aria-label="前日">&lt;</button>
      <span id="currentDay"></span>
      <button id="nextDay" aria-label="翌日">&gt;</button>
    </div>
    <div id="mobileDayRate" class="day-rate"></div>
    <div class="mobile-mode-toggle">
      <button id="mobileCheckMode" class="mode-btn active">チェック</button>
      <button id="mobileEditMode" class="mode-btn">項目管理</button>
    </div>
    <div id="mobileCheckList" class="mobile-checklist"></div>
    <div id="mobileEditList" class="mobile-editlist" style="display:none"></div>
    <div id="mobileAddItem" class="mobile-add-item" style="display:none">
      <button id="mobileAddItemBtn" class="btn-small btn-add">＋ 項目追加</button>
    </div>
    <div class="mobile-reflection">
      <h3>振り返り</h3>
      <textarea id="mobileReflection" maxlength="200" placeholder="今日の振り返りを入力（200字以内）"></textarea>
      <div class="char-count"><span id="mobileCharCount">0</span>/200</div>
    </div>
    <div class="mobile-reflection">
      <h3>今日のＴＯＤＯ</h3>
      <textarea id="mobileTodayTodo" maxlength="1000" placeholder="今日のＴＯＤＯを入力（1000字以内、手動で更新）"></textarea>
      <button id="mobileCopyTodoBtn" class="btn-copy-todo btn-copy-todo-mobile">📋 メモ帳にコピー</button>
      <div class="char-count"><span id="mobileTodoCharCount">0</span>/1000</div>
    </div>
    <div class="mobile-reflection">
      <h3>今月のメモ・反省</h3>
      <textarea id="mobileMonthReview" maxlength="1000" placeholder="今月のメモ・反省を入力（1000字以内）"></textarea>
      <div class="char-count"><span id="mobileReviewCharCount">0</span>/1000</div>
    </div>
  </section>

  <!-- 行操作メニュー（ポップアップ） -->
  <div id="rowMenu" class="row-menu" style="display:none">
    <button data-action="edit">編集</button>
    <button data-action="copy">コピー</button>
    <button data-action="moveup">上へ移動</button>
    <button data-action="movedown">下へ移動</button>
    <button data-action="delete" class="danger">削除</button>
  </div>

  <!-- 月目標編集モーダル -->
  <div id="goalModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>今月の目標を設定</h3>
      <textarea id="goalInput" maxlength="1000" placeholder="今月の目標を入力（1000字以内）"></textarea>
      <div class="char-count"><span id="goalCharCount">0</span>/1000</div>
      <div class="modal-actions">
        <button id="goalCancel" class="btn-small">キャンセル</button>
        <button id="goalSave" class="btn-small btn-primary">保存</button>
      </div>
    </div>
  </div>

  <footer class="site-footer"><p style="width:100%;text-align:center;margin:0;">企画・提供：山崎誠政策研究所</p></footer>

  <script src="app.js"></script>
</body>
</html>
